<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hệ Thống Cảnh Báo Té Ngã</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:10px 16px 40px;font-family:Arial,Helvetica,sans-serif;background:#f4f4f9;color:#000}
  h1{text-align:center;font-size:2rem;margin:10px 0 14px}
  .conn{text-align:center;font-size:.85rem;font-weight:700;margin-bottom:6px}
  .conn.ok{color:#2ecc71}
  .conn.wait{color:#e67e22}
  .conn.bad{color:#e74c3c}
  .conns{margin-bottom:12px}
  .wrap{max-width:810px;margin:0 auto}
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:16px}
  .status{background:#2ecc71;color:#fff;font-size:1.7rem;font-weight:700;text-align:center;
          padding:14px;border-radius:10px;text-transform:uppercase;transition:background .2s}
  .status.fall{background:#e74c3c;animation:blink .8s steps(2) infinite}
  .status.wait{background:#95a5a6;font-size:1.3rem}
  .status.lost{background:#e67e22;font-size:1.3rem}
  @keyframes blink{50%{background:#c0392b}}
  @media (prefers-reduced-motion:reduce){.status.fall{animation:none}}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .metric{text-align:center;padding:20px 12px}
  .metric .label{font-size:.95rem}
  .metric .value{font-size:2rem;font-weight:700;margin-top:6px}
  .metric .num.o{color:#e67e22}
  .metric .num.b{color:#2980b9}
  .chart{padding:14px 16px;height:213px}
  .ctrl{text-align:center;margin-top:16px;padding:22px 16px}
  .ctrl h3{margin:0 0 18px;font-size:1.05rem}
  .line{margin-bottom:12px;font-size:.95rem}
  .line span{margin-right:6px}
  button{font:inherit;font-weight:700;text-transform:uppercase;color:#fff;border:none;border-radius:6px;
         padding:11px 20px;margin:0 3px;cursor:pointer}
  button:focus-visible{outline:3px solid #333;outline-offset:2px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.on{background:#fff;color:#1e8449;border:2px solid #2ecc71}
  button.off{background:#fff;color:#c0392b;border:2px solid #e74c3c}
  button.on.sel{background:#2ecc71;color:#fff}
  button.off.sel{background:#e74c3c;color:#fff}
  button.sel:disabled{opacity:.85}
  .badge{display:inline-block;min-width:112px;padding:5px 12px;border-radius:999px;font-size:.8rem;
         font-weight:700;margin-right:10px;background:#ecf0f1;color:#7f8c8d;border:2px solid #bdc3c7}
  .badge.lit{background:#d5f5e3;color:#1e8449;border-color:#2ecc71}
  .reset{background:#34495e;margin-top:6px}
  .mode{background:#7f8c8d;min-width:190px}
  .mode.active{background:#2980b9}
  .hint{font-size:.82rem;color:#7f8c8d;margin:-4px 0 16px}
  @media (max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hệ Thống Cảnh Báo Té Ngã</h1>
  <div class="conns">
    <div class="conn wait" id="connBroker">Đang kết nối EMQX Broker...</div>
    <div class="conn wait" id="connEsp">ESP32: chưa kết nối</div>
  </div>

  <div class="card"><div class="status wait" id="status">Đang chờ kết nối ESP32...</div></div>

  <div class="row">
    <div class="card metric">
      <div class="label">Gia tốc tổng (SVM)</div>
      <div class="value"><span class="num o" id="accel">--</span> g</div>
    </div>
    <div class="card metric">
      <div class="label">Góc nghiêng</div>
      <div class="value"><span class="num b" id="angle">--</span> °</div>
    </div>
  </div>

  <div class="row">
    <div class="card chart"><canvas id="chartAccel"></canvas></div>
    <div class="card chart"><canvas id="chartAngle"></canvas></div>
  </div>

  <div class="card ctrl">
    <h3>Điều khiển thủ công</h3>
    <div class="line"><span>Chế độ Manual:</span>
      <button class="mode" id="btnManual">Manual: TẮT</button></div>
    <div class="hint" id="hint">Bật chế độ Manual để điều khiển đèn LED và loa.</div>
    <div class="line"><span>Đèn LED:</span><span class="badge" id="ledBadge">○ Đang tắt</span>
      <button class="on" id="ledOn">Bật</button><button class="off" id="ledOff">Tắt</button></div>
    <div class="line"><span>Loa cảnh báo:</span><span class="badge" id="buzBadge">○ Đang tắt</span>
      <button class="on" id="buzOn">Bật</button><button class="off" id="buzOff">Tắt</button></div>
    <button class="reset" id="btnReset">Reset cảnh báo</button>
  </div>
</div>

<script>
  // ---- Phải trùng PREFIX với code ESP32 Lab 3 ----
  const PREFIX = "lab3de5_DuongKimTungDuong_231432199";
  const BROKER = "wss://broker.emqx.io:8084/mqtt";
  const T_ACCEL  = PREFIX + "/mpu6050/accel";
  const T_ANGLE  = PREFIX + "/mpu6050/angle";
  const T_STATUS = PREFIX + "/status";
  const T_LED    = PREFIX + "/device/led";
  const T_BUZZER = PREFIX + "/device/buzzer";
  const T_RESET  = PREFIX + "/device/reset";
  const T_MANUAL = PREFIX + "/device/manual";

  const ESP_TIMEOUT_MS = 3000;   // quá 3 giây không có dữ liệu mới => coi như mất kết nối ESP32

  const $ = id => document.getElementById(id);
  const MAX_POINTS = 30;
  const deviceBtns = ["ledOn","ledOff","buzOn","buzOff"].map($);   // chỉ dùng được khi Manual bật
  let manualOn = false;
  let ledState = false, buzState = false;   // trạng thái LED/Loa do người dùng đặt trong chế độ Manual

  let brokerOk = false;
  let espOnline = false;
  let everOnline = false;
  let lastDataTime = 0;
  let lastStatus = "NORMAL";   // trạng thái mới nhất ESP32 gửi (có thể là bản retained cũ)

  // ---- Biểu đồ ----
  function makeChart(id, label, border, fill){
    return new Chart($(id), {
      type: "line",
      data: { labels: [], datasets: [{ label, data: [], borderColor: border, backgroundColor: fill,
        borderWidth: 2, pointRadius: 0, tension: 0.3, fill: true }] },
      options: { animation: false, responsive: true, maintainAspectRatio: false,
        scales: { y: { beginAtZero: true }, x: { ticks: { maxTicksLimit: 5 } } } }
    });
  }
  const chartAccel = makeChart("chartAccel", "Gia tốc SVM (g)", "#e67e22", "rgba(230,126,34,.15)");
  const chartAngle = makeChart("chartAngle", "Góc nghiêng (°)", "#2980b9", "rgba(41,128,185,.15)");

  function pushPoint(chart, v){
    chart.data.labels.push(new Date().toLocaleTimeString("vi-VN"));
    chart.data.datasets[0].data.push(v);
    if (chart.data.labels.length > MAX_POINTS){
      chart.data.labels.shift();
      chart.data.datasets[0].data.shift();
    }
    chart.update();
  }

  // ---- Hiển thị theo trạng thái kết nối ----
  function setLine(el, cls, text){ el.className = "conn " + cls; el.textContent = text; }

  function render(){
    // Dòng trạng thái broker
    if (brokerOk) setLine($("connBroker"), "ok", "Đã kết nối EMQX Broker thành công!");

    // Dòng trạng thái ESP32 + thanh trạng thái lớn
    const st = $("status");
    if (!brokerOk){
      setLine($("connEsp"), "wait", "ESP32: chưa kết nối");
      st.className = "status wait";
      st.textContent = "Đang chờ kết nối...";
    } else if (!espOnline){
      if (everOnline){
        setLine($("connEsp"), "bad", "Mất kết nối với ESP32!");
        st.className = "status lost";
        st.textContent = "Mất kết nối ESP32";
      } else {
        setLine($("connEsp"), "wait", "Đang chờ ESP32 gửi dữ liệu...");
        st.className = "status wait";
        st.textContent = "Đang chờ kết nối ESP32...";
      }
    } else {
      setLine($("connEsp"), "ok", "Đã kết nối ESP32 thành công!");
      if (lastStatus === "FALL"){
        st.className = "status fall";
        st.textContent = "Phát hiện té ngã!";
      } else {
        st.className = "status";
        st.textContent = "Bình thường";
      }
    }
    updateControls();
  }

  // Vẽ trạng thái LED/Loa: nút đang chọn được tô đậm và có dấu ✓, kèm nhãn ĐANG BẬT / ĐANG TẮT
  function paintDevice(on, badgeId, onId, offId){
    const b = $(badgeId);
    b.textContent = on ? "● Đang bật" : "○ Đang tắt";
    b.classList.toggle("lit", on);
    $(onId).classList.toggle("sel", on);
    $(offId).classList.toggle("sel", !on);
    $(onId).textContent  = (on ? "✓ " : "") + "Bật";
    $(offId).textContent = (!on ? "✓ " : "") + "Tắt";
  }

  function updateControls(){
    // Manual: theo nút người dùng bấm; Auto: LED/Loa chỉ bật khi đang báo động té ngã
    const autoAlarm = espOnline && lastStatus === "FALL";
    paintDevice(manualOn ? ledState : autoAlarm, "ledBadge", "ledOn", "ledOff");
    paintDevice(manualOn ? buzState : autoAlarm, "buzBadge", "buzOn", "buzOff");

    $("btnManual").disabled = !espOnline;
    $("btnReset").disabled  = !espOnline;
    deviceBtns.forEach(b => b.disabled = !(espOnline && manualOn));
    $("btnManual").classList.toggle("active", manualOn);
    $("btnManual").textContent = "Manual: " + (manualOn ? "BẬT" : "TẮT");
    $("hint").textContent = !espOnline ? "Chưa kết nối ESP32."
      : manualOn ? (lastStatus === "FALL"
                    ? "Đang báo động té ngã: LED và loa vẫn kêu, bấm Tắt để tắt."
                    : "Đang ở chế độ Manual: bạn điều khiển được đèn LED và loa.")
                 : "Bật chế độ Manual để điều khiển đèn LED và loa.";
  }

  // Gửi lại trạng thái Manual/LED/Loa cho ESP32 (đồng bộ sau khi kết nối lại)
  function resyncDevice(){
    setTimeout(() => {          // chờ ESP32 subscribe xong topic
      client.publish(T_MANUAL, manualOn ? "ON" : "OFF");
      if (manualOn){
        client.publish(T_LED,    ledState ? "ON" : "OFF");
        client.publish(T_BUZZER, buzState ? "ON" : "OFF");
      }
    }, 500);
  }

  function setOnline(on){
    if (on === espOnline) return;
    espOnline = on;
    if (on){
      everOnline = true;
      resyncDevice();           // KHÔNG reset manual nữa, đồng bộ lại cho mạch
    } else {
      $("accel").textContent = "--";
      $("angle").textContent = "--";
    }
    render();
  }

  // Kiểm tra mỗi giây: có dữ liệu mới trong 3 giây gần nhất không
  setInterval(() => {
    if (espOnline && Date.now() - lastDataTime > ESP_TIMEOUT_MS) setOnline(false);
  }, 1000);

  // ---- MQTT ----
  const client = mqtt.connect(BROKER, { clientId: "web-fall-" + Math.random().toString(16).slice(2,8) });

  client.on("connect", () => {
    brokerOk = true;
    client.subscribe([T_ACCEL, T_ANGLE, T_STATUS]);
    render();
  });
  client.on("reconnect", () => { brokerOk = false; setOnline(false); setLine($("connBroker"), "wait", "Đang kết nối lại..."); render(); });
  client.on("error", () => { brokerOk = false; setLine($("connBroker"), "bad", "Lỗi kết nối broker"); render(); });

  client.on("message", (topic, payload) => {
    const msg = payload.toString();

    if (topic === T_STATUS){
      lastStatus = msg;          // chỉ lưu; chỉ hiển thị khi ESP32 đã online
      render();
      return;
    }

    // accel / angle chỉ do ESP32 gửi (không retain) => dùng làm tín hiệu ESP32 đang sống
    const v = parseFloat(msg);
    if (isNaN(v)) return;
    lastDataTime = Date.now();
    setOnline(true);

    if (topic === T_ACCEL){ $("accel").textContent = v.toFixed(2); pushPoint(chartAccel, v); }
    if (topic === T_ANGLE){ $("angle").textContent = v.toFixed(1); pushPoint(chartAngle, v); }
  });

  // ---- Nút điều khiển (manual) ----
  $("ledOn").onclick  = () => { ledState = true;  client.publish(T_LED, "ON");  updateControls(); };
  $("ledOff").onclick = () => { ledState = false; client.publish(T_LED, "OFF"); updateControls(); };
  $("buzOn").onclick  = () => { buzState = true;  client.publish(T_BUZZER, "ON");  updateControls(); };
  $("buzOff").onclick = () => { buzState = false; client.publish(T_BUZZER, "OFF"); updateControls(); };
  $("btnManual").onclick = () => {
    manualOn = !manualOn;
    // Vào Manual lúc đang té ngã: ESP32 giữ LED/Loa đang kêu; thoát Manual: LED/Loa tay tắt
    ledState = buzState = manualOn && lastStatus === "FALL";
    client.publish(T_MANUAL, manualOn ? "ON" : "OFF");
    updateControls();
  };
  $("btnReset").onclick = () => {
    lastStatus = "NORMAL"; manualOn = false; ledState = buzState = false;
    client.publish(T_RESET, "1");
    render();
  };

  render();
</script>
</body>
</html>
